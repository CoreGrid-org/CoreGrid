[project]
name = "coregrid-planner-agent"
version = "0.1.0"
description = "CoreGrid Planner Agent for asset lifecycle evaluations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.2,<1",
  "openai>=1.66,<2",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
