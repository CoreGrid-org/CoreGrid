# Serves the built single-page app. Every unknown path falls back to
# index.html so client-side routes (/admin/assets, …) survive a refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build output has a content hash in the name (index-B7xk2Q9a.js),
    # so those files can be cached forever. Plain files from public/ (the
    # logo) fall through to the default below.
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|svg|png|jpe?g|webp)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated so a new release is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
