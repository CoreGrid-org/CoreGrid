name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# A newer push to the same branch/PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    env:
      # Same credentials/port as the local docker-compose Postgres, so the
      # tests' defaults (backend.Tests/AppendOnlyTests.cs) work unchanged.
      TEST_DB_CONNECTION: Host=localhost;Port=5433;Database=coregrid;Username=coregrid;Password=coregrid
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coregrid
          POSTGRES_USER: coregrid
          POSTGRES_PASSWORD: coregrid
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U coregrid -d coregrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.*"

      # Restoring the test project restores the API too (ProjectReference).
      - name: Restore
        run: dotnet restore backend.Tests

      - name: Build (zero warnings expected)
        run: dotnet build backend.Tests --no-restore -warnaserror

      # The real-Postgres tests (append-only grants) need the schema in place.
      - name: Apply migrations
        run: dotnet ef database update --no-build --project backend --connection "$TEST_DB_CONNECTION"

      - name: Test (InMemory service-layer tests + real-Postgres append-only/authorization checks)
        run: dotnet test backend.Tests --no-build

  frontend:
    name: Frontend (test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Test (Vitest + React Testing Library)
        run: npm test
        working-directory: frontend

      - name: Build (tsc -b && vite build — doubles as the typecheck; no separate lint script exists yet)
        run: npm run build
        working-directory: frontend
